databaseChangeLog:
  - changeSet:
      id: 001-create-app-users-table
      author: hristiyan
      changes:
        - createTable:
            tableName: app_users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_users
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_app_users_username
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-athletes-table
      author: hristiyan
      changes:
        - createTable:
            tableName: athletes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_athletes
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_athletes_user_id
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: athletes
            baseColumnNames: user_id
            referencedTableName: app_users
            referencedColumnNames: id
            constraintName: fk_athletes_user

  - changeSet:
      id: 003-create-competitions-table
      author: hristiyan
      changes:
        - createTable:
            tableName: competitions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_competitions
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: min_age
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: competition_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(40)
                  defaultValue: OPEN
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-competition-registrations-table
      author: hristiyan
      changes:
        - createTable:
            tableName: competition_registrations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_competition_registrations
              - column:
                  name: competition_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: athlete_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: registered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: competition_registrations
            baseColumnNames: competition_id
            referencedTableName: competitions
            referencedColumnNames: id
            constraintName: fk_competition_registrations_competition
        - addForeignKeyConstraint:
            baseTableName: competition_registrations
            baseColumnNames: athlete_id
            referencedTableName: athletes
            referencedColumnNames: id
            constraintName: fk_competition_registrations_athlete
        - addUniqueConstraint:
            tableName: competition_registrations
            columnNames: competition_id, athlete_id
            constraintName: uk_competition_registrations_competition_athlete

  - changeSet:
      id: 005-create-slalom-results-table
      author: hristiyan
      changes:
        - createTable:
            tableName: slalom_results
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_slalom_results
              - column:
                  name: competition_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: athlete_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: first_run_time
                  type: DECIMAL(10,3)
              - column:
                  name: second_run_time
                  type: DECIMAL(10,3)
              - column:
                  name: did_not_finish_first_run
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: did_not_finish_second_run
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: qualified_for_second_run
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: total_time
                  type: DECIMAL(10,3)
              - column:
                  name: rank_position
                  type: INT
              - column:
                  name: medal
                  type: VARCHAR(20)
                  defaultValue: NONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: slalom_results
            baseColumnNames: competition_id
            referencedTableName: competitions
            referencedColumnNames: id
            constraintName: fk_slalom_results_competition
        - addForeignKeyConstraint:
            baseTableName: slalom_results
            baseColumnNames: athlete_id
            referencedTableName: athletes
            referencedColumnNames: id
            constraintName: fk_slalom_results_athlete
        - addUniqueConstraint:
            tableName: slalom_results
            columnNames: competition_id, athlete_id
            constraintName: uk_slalom_results_competition_athlete

  - changeSet:
      id: 006-create-biathlon-results-table
      author: hristiyan
      changes:
        - createTable:
            tableName: biathlon_results
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_biathlon_results
              - column:
                  name: competition_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: athlete_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ski_time
                  type: DECIMAL(10,3)
              - column:
                  name: missed_shots
                  type: INT
              - column:
                  name: penalty_seconds
                  type: DECIMAL(10,3)
              - column:
                  name: final_time
                  type: DECIMAL(10,3)
              - column:
                  name: did_not_finish
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: rank_position
                  type: INT
              - column:
                  name: medal
                  type: VARCHAR(20)
                  defaultValue: NONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: biathlon_results
            baseColumnNames: competition_id
            referencedTableName: competitions
            referencedColumnNames: id
            constraintName: fk_biathlon_results_competition
        - addForeignKeyConstraint:
            baseTableName: biathlon_results
            baseColumnNames: athlete_id
            referencedTableName: athletes
            referencedColumnNames: id
            constraintName: fk_biathlon_results_athlete
        - addUniqueConstraint:
            tableName: biathlon_results
            columnNames: competition_id, athlete_id
            constraintName: uk_biathlon_results_competition_athlete

  - changeSet:
      id: 007-create-indexes
      author: hristiyan
      changes:
        - createIndex:
            tableName: competitions
            indexName: idx_competitions_type
            columns:
              - column:
                  name: type
        - createIndex:
            tableName: competitions
            indexName: idx_competitions_gender
            columns:
              - column:
                  name: gender
        - createIndex:
            tableName: competition_registrations
            indexName: idx_competition_registrations_competition_id
            columns:
              - column:
                  name: competition_id
        - createIndex:
            tableName: competition_registrations
            indexName: idx_competition_registrations_athlete_id
            columns:
              - column:
                  name: athlete_id
        - createIndex:
            tableName: slalom_results
            indexName: idx_slalom_results_competition_id
            columns:
              - column:
                  name: competition_id
        - createIndex:
            tableName: biathlon_results
            indexName: idx_biathlon_results_competition_id
            columns:
              - column:
                  name: competition_id